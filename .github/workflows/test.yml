name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Shared CI runners are noisier than dev machines; the local budget is 150 ms.
      WIT_PERF_BUDGET_MS: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Requirements, behavior and performance tests
        run: python -m unittest discover -s tests -v
      - name: Traceability matrix
        run: python tests/traceability.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install coverage
      - name: Tests under coverage (subprocess-level)
        run: WIT_COVERAGE=1 python -m unittest discover -s tests
      - name: Coverage report (fails under 90%)
        run: |
          python -m coverage combine
          python -m coverage report

  morpheus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Morpheus tests (R23–R34)
        run: npm test
      - name: dist/ matches src/
        run: npm run build && git diff --exit-code plugins/wit/morpheus/dist
